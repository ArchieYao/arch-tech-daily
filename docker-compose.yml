services:
  ai-daily-web:
    build: .
    container_name: ai-daily-web
    restart: unless-stopped
    # 容器内存硬限制：防止单容器耗尽服务器内存（2GB 服务器分配 640MB）
    mem_limit: 640m
    memswap_limit: 640m
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      - CONFIG_SECRET=${CONFIG_SECRET:-}
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=3456
      - WERSS_BASE_URL=http://we-mp-rss:8001
      # PDF 中文字体路径（容器内路径，要与 public/fonts 中的文件名对应）
      - PDF_FONT_PATH=/app/public/fonts/NotoSansSC-VariableFont_wght.ttf
      - WERSS_DB_PATH=/app/we-mp-rss/data/db.db
      - WERSS_USERNAME=${WERSS_USERNAME:-admin}
      - WERSS_PASSWORD=${WERSS_PASSWORD:-admin@123}
      # 302 目标：/api/werss/open-ui。主站 HSTS 时必须 http://公网IP:8001（不要用同域名）
      - WERSS_UI_URL=${WERSS_UI_URL:-}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      # 默认关闭 ai-daily 的凌晨全量刷新，避免与 WeRSS 内置任务重复；改为 true 可一键恢复
      - ENABLE_MPS_DAILY_REFRESH=${ENABLE_MPS_DAILY_REFRESH:-false}
    volumes:
      - ai-daily-data:/app/data
      - ./we-mp-rss/data:/app/we-mp-rss/data:ro
    depends_on:
      - we-mp-rss

  we-mp-rss:
    image: ghcr.io/rachelos/we-mp-rss:latest
    container_name: we-mp-rss
    restart: unless-stopped
    labels:
      - autoheal=true
    # 容器内存硬限制：Playwright 进程较重，提升到 1024m 降低 EPIPE/崩溃概率
    mem_limit: 1024m
    memswap_limit: 1024m
    # 8001 需从浏览器访问公众号管理后台时，映射到 0.0.0.0（写作 "8001:8001"）并在云安全组放行 TCP 8001。
    # 若仅本机/Nginx 反代访问，可改回 "127.0.0.1:8001:8001"。
    ports:
      - "8001:8001"
    environment:
      # 限制历史抓取页数，降低被风控风险；可在 .env 中一键恢复
      - MAX_PAGE=${WERSS_MAX_PAGE:-1}
      # Chromium 在服务器环境通常比 WebKit 更稳定，减少二维码登录线程崩溃概率
      - BROWSER_TYPE=chromium
      # 启用 we-mp-rss 内置定时任务（自动抓取订阅号新文章）
      - ENABLE_JOB=True
      # 定时任务执行间隔（秒）：默认 6 小时，避免公众号较多时持续触发微信限流
      - SPAN_INTERVAL=${WERSS_SPAN_INTERVAL:-21600}
    volumes:
      - ./we-mp-rss/data:/app/data
    # 抓取时进程可能短暂忙，过严的探活 + autoheal 会反复重启容器，导致「永远刷不完」
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=12)\""]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # 给 we-mp-rss 更长启动与长任务窗口，避免误杀
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ai-daily-data:
